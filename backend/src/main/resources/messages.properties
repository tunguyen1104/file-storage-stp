# ─── Application Error Messages ────────────────────────────────────────────────
# Keys correspond to ErrorCode.key values that follow i18n naming conventions.
# Codes with inline messages (e.g. "Token expired") fall back to the raw key.

errors.invalid-payload=Invalid request payload.
errors.access-denied=Access denied.
error.invalid-credential=Invalid credentials.
error.account-disabled=This account has been deactivated. Please contact your administrator.
error.reset-token-invalid=Reset token is invalid or has expired.
error.verify-token-invalid=Verification token is invalid or has expired.
error.account-already-verified=This account has already been verified.
errors.server-error=An unexpected error occurred. Please try again later.

