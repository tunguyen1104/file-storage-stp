spring:

  application:
    name: file-storage

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  task:
    scheduling:
      enabled: true

app:
  upload:
    max-file-size-bytes: ${MAX_UPLOAD_FILE_SIZE_BYTES:4294967296}

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # 'prometheus' removed — micrometer-registry-prometheus not on classpath
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
