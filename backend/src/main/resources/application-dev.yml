spring:
  security:
    filter:
      dispatcher-types: request

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file-storage}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@filestorage.local}
  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
      accessTokenExpirationMs: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
      refreshTokenExpirationMs: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    securedCookie: false  # true in production (requires HTTPS)
    resetTokenExpirationMs: ${RESET_TOKEN_EXPIRATION:3600000}         # 1 hour
    emailVerificationExpirationMs: ${VERIFY_TOKEN_EXPIRATION:86400000} # 24 hours
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL}
      password: ${SUPER_ADMIN_PASSWORD}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    external-url: ${MINIO_EXTERNAL_URL:http://localhost:9000}
    bucket: ${MINIO_BUCKET:file-storage}
  storage:
    default-download-ttl-minutes: ${FILE_DOWNLOAD_DEFAULT_TTL_MINUTES:15}
    single-upload-max-mb: ${FILE_SINGLE_UPLOAD_MAX_MB:100}
    multipart-threshold-mb: ${FILE_MULTIPART_THRESHOLD_MB:100}
    key-pattern: ${FILE_STORAGE_KEY_PATTERN:tenantId/userId/fileId.ext}
  upload:
    presigned-put-ttl-minutes: ${PRESIGNED_PUT_TTL_MINUTES:15}
    pending-cleanup-threshold-hours: ${PENDING_CLEANUP_THRESHOLD_HOURS:1}
    multipart:
      part-url-ttl-minutes: ${MULTIPART_PART_URL_TTL_MINUTES:30}
      session-ttl-hours: ${MULTIPART_SESSION_TTL_HOURS:24}
      cleanup-interval-minutes: ${MULTIPART_CLEANUP_INTERVAL_MINUTES:30}
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - image/svg+xml
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain
      - text/csv
      - video/mp4
      - video/quicktime
      - video/x-msvideo
      - audio/mpeg
      - audio/wav
      - audio/flac
      - audio/ogg
      # Potentially risky — allowed but virus-scanned; frontend must warn users
      - application/zip
      - application/x-zip-compressed
      - application/x-rar-compressed
      - application/x-7z-compressed
      - application/x-tar
      - application/gzip
      - application/x-msdownload
      - application/x-executable
      - application/x-msi
      - application/x-deb
      - application/x-rpm
      - application/java-archive
      - application/octet-stream
      - application/vnd.android.package-archive
    virus-scan:
      bypass-scan-size-mb: ${VIRUS_SCAN_BYPASS_SIZE_MB:50}
      bypass-mime-types:
        - video/mp4
        - video/quicktime
        - video/x-msvideo
        - audio/mpeg
        - audio/wav
        - audio/flac
        - audio/ogg
  virus-scan:
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3001}
      timeout-ms: ${CLAMAV_TIMEOUT_MS:60000}
      max-scan-file-size-bytes: ${CLAMAV_MAX_SCAN_FILE_SIZE_BYTES:209715200}
server:
  port: 8081
