spring:
  security:
    filter:
      dispatcher-types: request

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file-storage}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@filestorage.local}
  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
      accessTokenExpirationMs: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
      refreshTokenExpirationMs: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    securedCookie: false  # true in production (requires HTTPS)
    resetTokenExpirationMs: ${RESET_TOKEN_EXPIRATION:3600000}         # 1 hour
    emailVerificationExpirationMs: ${VERIFY_TOKEN_EXPIRATION:86400000} # 24 hours
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL}
      password: ${SUPER_ADMIN_PASSWORD}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    external-url: ${MINIO_EXTERNAL_URL:http://localhost:9000}
    bucket: ${MINIO_BUCKET:file-storage}
  storage:
    default-download-ttl-minutes: ${FILE_DOWNLOAD_DEFAULT_TTL_MINUTES:15}
    single-upload-max-mb: ${FILE_SINGLE_UPLOAD_MAX_MB:100}
    multipart-threshold-mb: ${FILE_MULTIPART_THRESHOLD_MB:100}
    key-pattern: ${FILE_STORAGE_KEY_PATTERN:tenantId/userId/fileId.ext}
  upload:
    presigned-put-ttl-minutes: ${PRESIGNED_PUT_TTL_MINUTES:15}
    pending-cleanup-threshold-hours: ${PENDING_CLEANUP_THRESHOLD_HOURS:1}
    multipart:
      part-url-ttl-minutes: ${MULTIPART_PART_URL_TTL_MINUTES:30}
      session-ttl-hours: ${MULTIPART_SESSION_TTL_HOURS:24}
      cleanup-interval-minutes: ${MULTIPART_CLEANUP_INTERVAL_MINUTES:30}
    virus-scan:
      bypass-scan-size-mb: ${VIRUS_SCAN_BYPASS_SIZE_MB:50}
      scan-mime-types:
        # Documents
        - application/pdf
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.ms-powerpoint
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - application/rtf
        - text/rtf
        - text/plain
        - text/csv
        - text/html
        - application/xml
        - text/xml
        # Archives / compressed
        - application/zip
        - application/x-zip-compressed
        - application/x-rar-compressed
        - application/x-7z-compressed
        - application/x-tar
        - application/gzip
        - application/x-bzip2
        # Executables and installers
        - application/x-msdownload
        - application/x-executable
        - application/x-msi
        - application/x-deb
        - application/x-rpm
        - application/java-archive
        - application/octet-stream
        # Scripts
        - application/javascript
        - text/javascript
        - application/x-sh
        - text/x-python
        - application/x-python-code
        # SVG (can embed scripts)
        - image/svg+xml
  virus-scan:
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3001}
      timeout-ms: ${CLAMAV_TIMEOUT_MS:60000}
      max-scan-file-size-bytes: ${CLAMAV_MAX_SCAN_FILE_SIZE_BYTES:209715200}
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:true}
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    indices:
      files: ${ELASTICSEARCH_INDEX_FILES:files}
      folders: ${ELASTICSEARCH_INDEX_FOLDERS:folders}
  search:
    cache:
      ttl-minutes: ${SEARCH_CACHE_TTL_MINUTES:5}              # full-text (Enter path)
      sayt-ttl-seconds: ${SEARCH_SAYT_CACHE_TTL_SECONDS:60}   # SAYT (dropdown path)
      max-keys-per-tenant: ${SEARCH_CACHE_MAX_KEYS_PER_TENANT:200}
    boosts:
      file-name: 5
      folder-name: 5
      content: 1
    pagination:
      default-size: ${SEARCH_PAGE_DEFAULT_SIZE:20}
      max-size: ${SEARCH_PAGE_MAX_SIZE:100}
    suggest:
      default-size: ${SEARCH_SUGGEST_DEFAULT_SIZE:8}
      max-size: ${SEARCH_SUGGEST_MAX_SIZE:10}
      max-query-length: ${SEARCH_SUGGEST_MAX_Q_LEN:50}
  indexing:
    content-key-prefix: ${INDEXING_CONTENT_KEY_PREFIX:contents/}
    max-content-chars: ${INDEXING_MAX_CONTENT_CHARS:500000}
    retry:
      interval-minutes: ${INDEXING_RETRY_INTERVAL_MINUTES:10}
      max-attempts: ${INDEXING_MAX_ATTEMPTS:3}
      eligible-after-minutes: ${INDEXING_RETRY_ELIGIBLE_AFTER:5}
    extractable-mime-types:
      - text/plain
      - text/csv
      - text/html
      - text/xml
      - application/xml
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - application/rtf
      - text/rtf
server:
  port: 8081
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
