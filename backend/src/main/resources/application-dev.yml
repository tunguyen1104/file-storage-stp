spring:
  security:
    filter:
      dispatcher-types: request

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:file-storage}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@filestorage.local}
  security:
    jwt:
      secret: ${JWT_SECRET_KEY}
      accessTokenExpirationMs: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
      refreshTokenExpirationMs: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    securedCookie: false  # true in production (requires HTTPS)
    resetTokenExpirationMs: ${RESET_TOKEN_EXPIRATION:3600000}         # 1 hour
    emailVerificationExpirationMs: ${VERIFY_TOKEN_EXPIRATION:86400000} # 24 hours
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL}
      password: ${SUPER_ADMIN_PASSWORD}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: ${MINIO_BUCKET:file-storage}
  storage:
    default-download-ttl-minutes: ${FILE_DOWNLOAD_DEFAULT_TTL_MINUTES:15}
    single-upload-max-mb: ${FILE_SINGLE_UPLOAD_MAX_MB:100}
    multipart-threshold-mb: ${FILE_MULTIPART_THRESHOLD_MB:100}
    key-pattern: ${FILE_STORAGE_KEY_PATTERN:tenantId/userId/fileId.ext}
server:
  port: 8081
