name: backend-dev

services:
  backend:
    image: ${BACKEND_IMAGE:-vnq88/filestorage-backend:dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_DEPENDENCY_WARMUP: "true"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MINIO_ENDPOINT: http://minio:9000
      CLAMAV_HOST: clamav-rest
      CLAMAV_PORT: 8090
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-true}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav-rest:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - backend-dev-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-dev-network

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-dev-network

  minio:
    image: minio/minio:${MINIO_SERVER_VERSION:-RELEASE.2024-06-13T22-53-53Z}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_EXTERNAL_URL}
      MINIO_REGION: "us-east-1"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-dev-network

  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2024-06-12T14-34-03Z}
    restart: "no"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set private local/${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - backend-dev-network

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data_dev:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks:
      - backend-dev-network

  clamav-rest:
    image: benzino77/clamav-rest-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 8090
      APP_FORM_KEY: FILES
      APP_MAX_FILE_SIZE: ${CLAMAV_MAX_SCAN_FILE_SIZE_BYTES:-57671680}
      CLAMD_IP: clamav
      CLAMD_PORT: 3310
      CLAMD_TIMEOUT: 60000
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - backend-dev-network

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-vnq88/filestorage-elasticsearch:9.0.3-icu}
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data_dev:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-dev-network

  kibana:
    image: kibana:9.0.3
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - backend-dev-network

volumes:
  redis_data_dev:
  minio_data_dev:
  clamav_data_dev:
  elasticsearch_data_dev:

networks:
  backend-dev-network:
    driver: bridge
