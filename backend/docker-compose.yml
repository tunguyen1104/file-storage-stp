version: '3.8'

services:
  postgres-db:
    container_name: postgres-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - file-storage-network
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - file-storage-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: file-storage-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@file.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    networks:
      - file-storage-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8078:8081"
    networks:
      - file-storage-network
    depends_on:
      - redis

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - file-storage-network

  minio:
    image: minio/minio:${MINIO_SERVER_VERSION:-RELEASE.2024-06-13T22-53-53Z}
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_EXTERNAL_URL}
      MINIO_REGION: "us-east-1"
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - file-storage-network

  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2024-06-12T14-34-03Z}
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set private local/${MINIO_BUCKET};
      exit 0;
      "
    restart: "no"
    networks:
      - file-storage-network

  clamav:
    image: clamav/clamav:stable
    container_name: clamav-file-storage
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - ./clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    networks:
      - file-storage-network

  clamav-rest:
    image: benzino77/clamav-rest-api
    container_name: clamav-rest-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_PORT=8090
      - APP_FORM_KEY=FILES
      - APP_MAX_FILE_SIZE=${CLAMAV_MAX_SCAN_FILE_SIZE_BYTES:-57671680}
      - CLAMD_IP=clamav
      - CLAMD_PORT=3310
      - CLAMD_TIMEOUT=60000
    ports:
      - "${CLAMAV_REST_PORT:-3001}:8090"
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - file-storage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  file-storage-network:
    driver: bridge